
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Expense</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <header class="topbar">
        <div class="brand">💰 Expense Tracker</div>
        <span class="tagline">Edit your expense details</span>
    </header>

    <main class="container">
        <div class="panel">
            <h2>Edit Expense</h2>
            <p class="panel-description">Update the details below.</p>

            <form method="POST">
                <label for="title">Expense Name</label>
                <input
                    type="text"
                    id="title"
                    name="title"
                    value="{{ expense.title }}"
                    maxlength="100"
                    required
                >

                <label for="amount">Amount (₹)</label>
                <input
                    type="number"
                    id="amount"
                    name="amount"
                    value="{{ expense.amount }}"
                    min="0.01"
                    step="0.01"
                    required
                >

                <label for="category">Category</label>
                <select id="category" name="category" required>
                    {% for category in ["Food", "Travel", "Shopping", "Education", "Bills", "Health", "Other"] %}
                        <option value="{{ category }}"
                            {% if expense.category == category %}selected{% endif %}>
                            {{ category }}
                        </option>
                    {% endfor %}
                </select>

                <label for="expense_date">Date</label>
                <input
                    type="date"
                    id="expense_date"
                    name="expense_date"
                    value="{{ expense.date }}"
                    required
                >

                <button type="submit" class="primary-btn">
                    Save Changes
                </button>
            </form>

            <p style="margin-top: 18px;">
                <a href="{{ url_for('home') }}">← Back to Expenses</a>
            </p>
        </div>
    </main>

</body>
</html>
